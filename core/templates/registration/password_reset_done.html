{% extends "core/base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header bg-warning text-dark">
                <h4 class="mb-0"><i class="fas fa-envelope me-2"></i>Link Enviado</h4>
            </div>
            <div class="card-body text-center">
                <div class="mb-4">
                    <i class="fas fa-paper-plane fa-3x text-warning mb-3"></i>
                    <h5>Verifique sua caixa de entrada</h5>
                    <p class="text-muted">Se o e-mail estiver cadastrado no sistema, você receberá um link para redefinir sua senha.</p>
                </div>
                <a href="{% url 'login' %}" class="btn btn-warning">
                    <i class="fas fa-sign-in-alt me-2"></i>Fazer Login
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
