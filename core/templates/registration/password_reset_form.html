{% extends "core/base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header bg-warning text-dark">
                <h4 class="mb-0"><i class="fas fa-key me-2"></i>Esqueceu a Senha?</h4>
            </div>
            <div class="card-body">
                <p class="text-muted">Informe o e-mail cadastrado para receber um link de redefinição de senha.</p>
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label fw-bold">E-mail</label>
                        {{ form.email }}
                        {% if form.email.errors %}
                            <div class="text-danger">{{ form.email.errors }}</div>
                        {% endif %}
                    </div>
                    <button type="submit" class="btn btn-warning">
                        <i class="fas fa-paper-plane me-2"></i>Enviar Link de Redefinição
                    </button>
                </form>
                <hr>
                <a href="{% url 'login' %}" class="text"><i class="fas fa-arrow-left me-1"></i>Voltar ao Login</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
